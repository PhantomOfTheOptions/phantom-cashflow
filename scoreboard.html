<!DOCTYPE html>
<html>
<head>
<title>Buying Cash Flow Scoreboard</title>

<style>

body{
background:#081326;
color:white;
font-family:Arial;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:#13223d;
padding:25px;
border-radius:20px;
margin-bottom:20px;
}

h1{
font-size:48px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.stat{
background:#1b2f53;
padding:20px;
border-radius:15px;
}

.value{
font-size:32px;
font-weight:bold;
color:#66d1ff;
}

.timeline-item{
padding:15px;
border-left:4px solid #2ecc71;
margin-bottom:15px;
background:#102040;
}

</style>

</head>

<body>

<div class="container">

<h1>Buying Cash Flow Scoreboard</h1>

<div class="card">

<div class="stats">

<div class="stat">
<div>Current Level</div>
<div class="value">1</div>
</div>

<div class="stat">
<div>Cash Flow</div>
<div class="value">$0</div>
</div>

<div class="stat">
<div>Goal</div>
<div class="value">$100</div>
</div>

<div class="stat">
<div>Progress</div>
<div class="value">0%</div>
</div>

</div>

</div>

<div class="card">

<h2>Current Holdings</h2>

<p>PFE - 0 Shares</p>
<p>O - $0</p>
<p>JEPI - $0</p>
<p>JEPQ - $0</p>

</div>

<div class="card">

<h2>Challenge Timeline</h2>

<div class="timeline-item">
Week 1 - Started Challenge With $3,000
</div>

</div>

</div>

</body>
</html>
